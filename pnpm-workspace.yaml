allowBuilds:
  better-sqlite3: true
  sharp: true
# Explicitly requested v7 patch releases may be newer than the release-age policy.
minimumReleaseAgeExclude:
  - applesauce-accounts@7.0.2
  - applesauce-core@7.0.1
  - applesauce-loaders@7.0.2
  - applesauce-signers@7.0.1
overrides:
  nostr-tools: 2.24.3
  # Keep the SDK on one core/account/signer type identity across exact transitive dependencies.
  applesauce-core: 7.0.1
  applesauce-accounts: 7.0.2
  applesauce-loaders: 7.0.2
  applesauce-signers: 7.0.1
